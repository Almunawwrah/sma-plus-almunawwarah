<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CMS Admin SMA Plus Almunawwarah</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #064e3b, #059669, #10b981);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            top: -100px;
            right: -100px;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            bottom: -80px;
            left: -80px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            overflow: hidden;
            margin: 0 auto 16px;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .login-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 0.875rem;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #ef4444;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .input-wrapper input.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .error-text {
            font-size: 0.8rem;
            color: #ef4444;
            margin-top: 4px;
            display: none;
        }

        .error-text.show {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            z-index: 3000;
            transform: translateX(120%);
            transition: transform 0.3s;
            max-width: 360px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: #ef4444;
        }

        .toast.success {
            background: #059669;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #059669;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .auth-info {
            margin-top: 16px;
            padding: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #166534;
            line-height: 1.5;
        }

        .auth-info strong {
            display: block;
            margin-bottom: 4px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-card {
                margin: 16px;
                padding: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <img src="../assets/logo.png" alt="Logo SMA Plus Almunawwarah">
            </div>
            <h1>SMA Plus Almunawwarah</h1>
            <p>CMS Admin Panel</p>
        </div>
        <form id="login-form">
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Masukkan email admin" required>
                </div>
                <div class="error-text" id="email-error">Masukkan alamat email yang valid</div>
            </div>
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Masukkan password" required minlength="6">
                </div>
                <div class="error-text" id="password-error">Password minimal 6 karakter</div>
            </div>
            <button type="submit" class="login-btn" id="login-btn">
                <div class="spinner"></div>
                <span class="btn-text">Masuk <i class="fas fa-arrow-right"></i></span>
            </button>
        </form>
        <div class="auth-info">
            <strong><i class="fas fa-shield-halved"></i> Autentikasi Supabase</strong>
            Login menggunakan akun Supabase Auth. Hubungi administrator jika belum memiliki akun.
        </div>
        <div class="back-link">
            <a href="../index.html">&larr; Kembali ke Website</a>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script>
        (function () {
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');
            const loginBtn = document.getElementById('login-btn');
            const toastEl = document.getElementById('toast');

            let toastTimeout = null;

            // Check if already logged in via Supabase Auth
            (async function checkSession() {
                try {
                    const session = await authGetSession();
                    if (session) {
                        const profile = await authGetProfile();
                        if (profile && profile.aktif === true) {
                            sessionStorage.setItem('smaplus_admin', JSON.stringify({
                                id: session.user.id,
                                email: session.user.email,
                                nama: profile.nama || session.user.email,
                                role: profile.role || 'editor'
                            }));
                            window.location.href = 'dashboard.html';
                            return;
                        }
                    }
                } catch (e) {
                    // Session check failed, show login form
                    console.warn('Session check failed:', e);
                }
            })();

            // Clear error states on input
            emailInput.addEventListener('input', function () {
                emailInput.classList.remove('error');
                emailError.classList.remove('show');
            });

            passwordInput.addEventListener('input', function () {
                passwordInput.classList.remove('error');
                passwordError.classList.remove('show');
            });

            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                let hasError = false;

                // Validate email
                if (!email || !email.includes('@')) {
                    emailInput.classList.add('error');
                    emailError.classList.add('show');
                    hasError = true;
                }

                // Validate password
                if (password.length < 6) {
                    passwordInput.classList.add('error');
                    passwordError.classList.add('show');
                    hasError = true;
                }

                if (hasError) return;

                // Disable button and show loading
                loginBtn.disabled = true;
                loginBtn.classList.add('loading');

                try {
                    // Sign in with Supabase Auth via api.js helper
                    const data = await authLogin(email, password);

                    if (!data || !data.user) {
                        showToast('Email atau password salah', 'error');
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('loading');
                        return;
                    }

                    // Fetch user profile for role check via api.js helper
                    const profile = await authGetProfile();

                    if (!profile) {
                        showToast('Profil tidak ditemukan', 'error');
                        await authLogout();
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('loading');
                        return;
                    }

                    if (!profile.aktif) {
                        showToast('Akun dinonaktifkan', 'error');
                        await authLogout();
                        loginBtn.disabled = false;
                        loginBtn.classList.remove('loading');
                        return;
                    }

                    // Store admin session info
                    sessionStorage.setItem('smaplus_admin', JSON.stringify({
                        id: data.user.id,
                        email: data.user.email,
                        nama: profile.nama || data.user.email,
                        role: profile.role || 'editor'
                    }));

                    showToast('Login berhasil!', 'success');

                    setTimeout(function () {
                        window.location.href = 'dashboard.html';
                    }, 1000);

                } catch (err) {
                    console.error('Login error:', err);
                    showToast('Terjadi kesalahan. Coba lagi.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                }
            });

            function showToast(message, type) {
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                }

                toastEl.textContent = message;
                toastEl.className = 'toast';

                // Force reflow to restart transition
                void toastEl.offsetWidth;

                toastEl.classList.add('show', type);

                toastTimeout = setTimeout(function () {
                    toastEl.classList.remove('show');
                }, 3000);
            }
        })();
    </script>
    <script>
        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                var swPath = (window.location.pathname.includes('/pages/') || window.location.pathname.includes('/admincms/')) ? '../sw.js' : 'sw.js';
                navigator.serviceWorker.register(swPath).then(function(reg) {
                    console.log('SW registered:', reg.scope);
                }).catch(function(err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
