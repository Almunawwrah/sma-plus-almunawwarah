<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenaga Pendidik - SMA Plus Almunawwarah</title>
    <meta name="description" content="Daftar tenaga pendidik dan guru SMA Plus Almunawwarah, pengajar profesional yang berkomitmen pada pendidikan Islam berkualitas.">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .guru-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .guru-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            text-align: center;
            transition: all 0.3s;
        }

        .guru-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
        }

        .guru-card-photo {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: var(--primary-lighter);
        }

        .guru-card-body {
            padding: 20px;
        }

        .guru-card-body h3 {
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--gray-800);
        }

        .guru-card-body .jabatan {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .guru-card-body .bidang {
            font-size: 0.8rem;
            color: var(--gray-500);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .guru-card-body .bidang i {
            font-size: 0.7rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
        }

        .empty-state p {
            font-size: 1rem;
            color: var(--gray-500);
        }

        @media (max-width: 992px) {
            .guru-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .guru-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .guru-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="page-header">
            <div class="container">
                <h1 data-aos="fade-up">Tenaga Pendidik</h1>
                <p data-aos="fade-up" data-aos-delay="100">Guru dan tenaga pengajar profesional kami</p>
                <div class="breadcrumb" data-aos="fade-up" data-aos-delay="200">
                    <a href="../index.html">Beranda</a>
                    <span>/</span>
                    <a href="#">Profil</a>
                    <span>/</span>
                    <span>Tenaga Pendidik</span>
                </div>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div class="text-center" style="margin-bottom: 40px;">
                    <span class="section-badge" data-aos="fade-up">Pendidik</span>
                    <h2 class="section-title" data-aos="fade-up" data-aos-delay="100">Guru & Staf Pengajar</h2>
                    <p class="section-subtitle" data-aos="fade-up" data-aos-delay="200">Tenaga pendidik berpengalaman dan berkomitmen yang membimbing generasi masa depan</p>
                </div>

                <div class="guru-grid" id="guru-grid">
                    <div class="loading-spinner" style="grid-column: 1 / -1;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        (function () {
            'use strict';

            var grid = document.getElementById('guru-grid');

            function renderGuru(data) {
                if (!data || data.length === 0) {
                    grid.innerHTML =
                        '<div class="empty-state">' +
                        '  <i class="fa-solid fa-chalkboard-user"></i>' +
                        '  <p>Data tenaga pendidik belum tersedia.</p>' +
                        '</div>';
                    return;
                }

                var html = '';

                data.forEach(function (item, index) {
                    var delay = (index % 4) * 100;
                    html +=
                        '<div class="guru-card" data-aos="fade-up" data-aos-delay="' + delay + '">' +
                        '  <img src="' + getImageUrl(item.foto) + '" alt="' + escapeHtml(item.nama) + '" class="guru-card-photo" onerror="this.src=\'https://via.placeholder.com/400x300/059669/ffffff?text=Guru\'">' +
                        '  <div class="guru-card-body">' +
                        '    <h3>' + escapeHtml(item.nama) + '</h3>' +
                        '    <div class="jabatan">' + escapeHtml(item.jabatan) + '</div>' +
                        (item.bidang_studi ? '    <div class="bidang"><i class="fa-solid fa-book"></i> ' + escapeHtml(item.bidang_studi) + '</div>' : '') +
                        '  </div>' +
                        '</div>';
                });

                grid.innerHTML = html;

                AOS.refresh();
            }

            async function loadTenagaPendidik() {
                try {
                    var data = await SMAPlusAPI.fetchTenagaPendidik();
                    renderGuru(data);
                } catch (err) {
                    console.error('Gagal memuat tenaga pendidik:', err);
                    grid.innerHTML =
                        '<div class="empty-state" style="grid-column: 1 / -1;">' +
                        '  <i class="fa-solid fa-circle-exclamation"></i>' +
                        '  <p>Gagal memuat data tenaga pendidik. Silakan coba lagi nanti.</p>' +
                        '</div>';
                }
            }

            loadTenagaPendidik();

            AOS.init({
                duration: 800,
                easing: 'ease-out-cubic',
                once: true,
                offset: 80
            });
        })();
    </script>
    <script>
        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                var swPath = (window.location.pathname.includes('/pages/') || window.location.pathname.includes('/admincms/')) ? '../sw.js' : 'sw.js';
                navigator.serviceWorker.register(swPath).then(function(reg) {
                    console.log('SW registered:', reg.scope);
                }).catch(function(err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
