<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Siswa Baru - SMA Plus Almunawwarah</title>
    <meta name="description" content="Formulir pendaftaran online PSB SMA Plus Almunawwarah — daftar sekarang dan bergabung dengan boarding school Islami terbaik.">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .psb-content { max-width: 1080px; margin: 0 auto; }

        /* ─────────────────────────────────────────────
           COUNTDOWN HERO — big & prominent
           ───────────────────────────────────────────── */
        .psb-countdown-hero {
            background: linear-gradient(135deg, var(--primary-deepest) 0%, var(--primary) 55%, var(--secondary) 100%);
            color: white;
            border-radius: var(--radius-xl);
            padding: 56px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 36px;
            box-shadow: 0 20px 50px -20px rgba(5,150,105,0.4);
        }
        .psb-countdown-hero::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 18% 50%, rgba(255,255,255,0.10) 0%, transparent 50%),
                radial-gradient(circle at 82% 25%, rgba(245,158,11,0.10) 0%, transparent 40%);
            pointer-events: none;
        }
        .psb-countdown-hero > * { position: relative; z-index: 1; }
        .psb-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(8px);
            margin-bottom: 18px;
        }
        .psb-status-badge .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 12px #fbbf24;
            animation: pulse 1.8s ease-in-out infinite;
        }
        .psb-status-badge.open .dot { background: #34d399; box-shadow: 0 0 12px #34d399; }
        .psb-status-badge.closed .dot { background: #f87171; box-shadow: 0 0 8px #f87171; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.85); }
        }
        .psb-countdown-hero h1 {
            color: white;
            font-size: clamp(1.7rem, 4vw, 2.4rem);
            margin-bottom: 10px;
            letter-spacing: -0.025em;
            line-height: 1.15;
        }
        .psb-countdown-hero .tahun {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 28px;
        }
        .countdown-status {
            font-size: 0.92rem;
            color: white;
            font-weight: 600;
            margin-bottom: 18px;
            opacity: 0.95;
            min-height: 22px;
        }
        .countdown-grid {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .countdown-item {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 18px 22px;
            text-align: center;
            min-width: 84px;
        }
        .countdown-item .number {
            font-size: 2.1rem;
            font-weight: 800;
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .countdown-item .label {
            font-size: 0.72rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 6px;
            font-weight: 600;
        }
        .psb-countdown-hero .cta-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .btn-daftar-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: white;
            color: var(--primary-dark);
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s var(--ease);
            box-shadow: 0 8px 20px -6px rgba(0,0,0,0.25);
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-daftar-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -8px rgba(0,0,0,0.35);
            color: var(--primary-dark);
        }
        .btn-daftar-primary:disabled,
        .btn-daftar-primary.disabled {
            background: rgba(255,255,255,0.5);
            color: rgba(4,120,87,0.6);
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }
        .btn-daftar-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1.5px solid rgba(255,255,255,0.5);
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s var(--ease);
            backdrop-filter: blur(8px);
        }
        .btn-daftar-secondary:hover {
            background: rgba(255,255,255,0.2);
            color: white;
            border-color: white;
        }

        .countdown-notice {
            display: inline-block;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 16px 28px;
            font-size: 0.95rem;
            color: white;
            margin-top: 8px;
        }
        .countdown-notice i { color: var(--accent); margin-right: 6px; }
        .countdown-done {
            display: inline-block;
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.4);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-md);
            padding: 16px 28px;
            font-size: 1rem;
            color: white;
            font-weight: 600;
            margin-top: 8px;
        }
        .countdown-done i { color: #34d399; margin-right: 6px; }

        /* ─────────────────────────────────────────────
           POSTER + INLINE DAFTAR BUTTON
           ───────────────────────────────────────────── */
        .psb-poster-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px -6px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.03);
            border: 1px solid rgba(15, 23, 42, 0.04);
        }
        .psb-poster-card .head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }
        .psb-poster-card .head .icon-box {
            width: 48px; height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 6px 14px -4px rgba(5,150,105,0.35);
            flex-shrink: 0;
        }
        .psb-poster-card .head h2 {
            font-size: 1.35rem;
            color: var(--gray-900);
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.015em;
        }
        .psb-poster-card .head .sub {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-top: 2px;
        }
        .psb-poster-wrap {
            position: relative;
            background: linear-gradient(135deg, var(--primary-lighter), #ffffff);
            border-radius: var(--radius-md);
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(5,150,105,0.08);
        }
        .psb-poster-wrap img {
            max-width: 100%;
            height: auto;
            max-height: 760px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 12px 28px -10px rgba(0,0,0,0.18);
            cursor: zoom-in;
            transition: transform 0.4s var(--ease);
            display: block;
            margin: 0 auto;
            background: white;
        }
        .psb-poster-wrap img:hover { transform: scale(1.005); }
        .psb-poster-empty {
            padding: 56px 20px;
            text-align: center;
            color: var(--gray-500);
        }
        .psb-poster-empty .ph-icon {
            width: 88px; height: 88px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem;
            color: var(--primary);
            box-shadow: 0 8px 24px -8px rgba(5,150,105,0.18);
        }
        .psb-poster-empty h4 {
            color: var(--gray-700);
            font-size: 1.05rem;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .psb-poster-empty p {
            color: var(--gray-500);
            font-size: 0.88rem;
            max-width: 380px;
            margin: 0 auto;
        }
        .psb-poster-actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .psb-poster-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: white;
            color: var(--primary-dark);
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid rgba(5,150,105,0.15);
            transition: all 0.25s var(--ease);
            cursor: pointer;
            font-family: inherit;
        }
        .psb-poster-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
        }
        .psb-poster-btn.primary {
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px -2px rgba(245,158,11,0.35);
        }
        .psb-poster-btn.primary:hover {
            filter: brightness(1.05);
            box-shadow: 0 8px 18px -4px rgba(245,158,11,0.5);
        }
        .psb-poster-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* ─────────────────────────────────────────────
           BROSUR DOWNLOAD CARD
           ───────────────────────────────────────────── */
        .psb-brosur-card {
            background: linear-gradient(135deg, #fffbeb 0%, #ffffff 60%, var(--primary-lighter) 100%);
            border-radius: var(--radius-md);
            padding: 28px;
            display: flex;
            align-items: center;
            gap: 22px;
            border: 1px solid rgba(245,158,11,0.18);
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }
        .psb-brosur-card::before {
            content: '';
            position: absolute;
            top: -40px; right: -40px;
            width: 140px; height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245,158,11,0.15), transparent 70%);
            pointer-events: none;
        }
        .psb-brosur-icon {
            width: 60px; height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 8px 18px -4px rgba(245,158,11,0.4);
            flex-shrink: 0;
        }
        .psb-brosur-info { flex: 1; min-width: 220px; }
        .psb-brosur-info h4 {
            font-size: 1.05rem;
            color: var(--gray-900);
            margin-bottom: 4px;
            font-weight: 700;
        }
        .psb-brosur-info p {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin: 0;
            line-height: 1.55;
        }
        .btn-download-brosur {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: white;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.92rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s var(--ease);
            font-family: inherit;
            box-shadow: 0 6px 14px -4px rgba(245,158,11,0.45);
            flex-shrink: 0;
        }
        .btn-download-brosur:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px -6px rgba(245,158,11,0.55);
            color: white;
            filter: brightness(1.05);
        }
        .btn-download-brosur:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .btn-download-brosur.loading { pointer-events: none; }
        .btn-download-brosur.loading i.fa-download { display: none; }
        .btn-download-brosur.loading::after {
            content: '';
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: btn-spin 0.7s linear infinite;
            margin-left: 2px;
        }
        @keyframes btn-spin { to { transform: rotate(360deg); } }

        /* ─────────────────────────────────────────────
           PRE-REGISTRATION CHECKLIST
           ───────────────────────────────────────────── */
        .psb-checklist-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px -6px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.03);
            border: 1px solid rgba(15, 23, 42, 0.04);
        }
        .psb-checklist-card .head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }
        .psb-checklist-card .head .icon-box {
            width: 48px; height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #d97706);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 6px 14px -4px rgba(245,158,11,0.35);
            flex-shrink: 0;
        }
        .psb-checklist-card .head h2 {
            font-size: 1.35rem;
            color: var(--gray-900);
            margin: 0;
            font-weight: 800;
            letter-spacing: -0.015em;
        }
        .psb-checklist-card .head .sub {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-top: 2px;
        }
        .psb-checklist-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .psb-checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--gray-50);
            border-radius: var(--radius);
            border: 1px solid rgba(15, 23, 42, 0.04);
            transition: all 0.25s var(--ease);
            cursor: pointer;
        }
        .psb-checklist-item:hover {
            background: var(--accent-light);
            border-color: rgba(245,158,11,0.18);
        }
        .psb-checklist-item .checkbox {
            width: 22px; height: 22px;
            border-radius: 6px;
            border: 2px solid var(--gray-300);
            background: white;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.2s var(--ease);
        }
        .psb-checklist-item.checked .checkbox {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: var(--primary);
            color: white;
        }
        .psb-checklist-item .checkbox i {
            font-size: 0.7rem;
            opacity: 0;
            transition: opacity 0.2s var(--ease);
        }
        .psb-checklist-item.checked .checkbox i { opacity: 1; }
        .psb-checklist-item span {
            font-size: 0.92rem;
            color: var(--gray-700);
            line-height: 1.5;
            flex: 1;
        }
        .psb-checklist-item.checked span {
            color: var(--gray-500);
            text-decoration: line-through;
        }
        .psb-checklist-progress {
            margin-top: 20px;
            padding: 16px 18px;
            background: linear-gradient(135deg, var(--primary-lighter), #ffffff);
            border-radius: var(--radius-md);
            border: 1px solid rgba(5,150,105,0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .psb-checklist-progress .progress-text {
            flex: 1;
            min-width: 160px;
        }
        .psb-checklist-progress .progress-text h4 {
            font-size: 0.98rem;
            color: var(--gray-800);
            margin-bottom: 4px;
            font-weight: 700;
        }
        .psb-checklist-progress .progress-text .sub {
            font-size: 0.82rem;
            color: var(--gray-500);
        }
        .psb-checklist-progress .progress-bar {
            flex: 2;
            min-width: 200px;
            height: 10px;
            background: var(--gray-200);
            border-radius: var(--radius-full);
            overflow: hidden;
            position: relative;
        }
        .psb-checklist-progress .progress-fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: var(--radius-full);
            transition: width 0.4s var(--ease);
            width: 0%;
        }
        .psb-checklist-progress .progress-pct {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--primary-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-width: 50px;
            text-align: right;
        }

        /* ─────────────────────────────────────────────
           QUICK INFO GRID (3 cards)
           ───────────────────────────────────────────── */
        .psb-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }
        .psb-info-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 26px 22px;
            text-align: center;
            box-shadow: 0 4px 16px -6px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.03);
            border: 1px solid rgba(15, 23, 42, 0.04);
            transition: all 0.3s var(--ease);
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .psb-info-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px -8px rgba(5,150,105,0.18);
            border-color: rgba(5,150,105,0.12);
        }
        .psb-info-card .icon {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary-lighter), var(--primary-light));
            color: var(--primary-dark);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 14px;
        }
        .psb-info-card h4 {
            font-size: 1rem;
            color: var(--gray-800);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .psb-info-card p {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-bottom: 12px;
            line-height: 1.55;
        }
        .psb-info-card .link {
            font-size: 0.82rem;
            color: var(--primary);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: gap 0.25s var(--ease);
        }
        .psb-info-card:hover .link { gap: 10px; }

        /* ─────────────────────────────────────────────
           FINAL CTA SECTION
           ───────────────────────────────────────────── */
        .psb-final-cta {
            background: linear-gradient(135deg, var(--primary-deepest) 0%, var(--primary) 55%, var(--secondary) 100%);
            color: white;
            border-radius: var(--radius-xl);
            padding: 56px 40px;
            text-align: center;
            margin-top: 16px;
            position: relative;
            overflow: hidden;
        }
        .psb-final-cta::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.10) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(245,158,11,0.12) 0%, transparent 50%);
            pointer-events: none;
        }
        .psb-final-cta > * { position: relative; z-index: 1; }
        .psb-final-cta h2 {
            color: white;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            margin-bottom: 14px;
            letter-spacing: -0.02em;
        }
        .psb-final-cta p {
            opacity: 0.92;
            margin-bottom: 28px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-size: 1.02rem;
            line-height: 1.7;
        }
        .psb-final-cta .cta-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ─────────────────────────────────────────────
           STICKY MOBILE CTA
           ───────────────────────────────────────────── */
        .psb-sticky-cta {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(5,150,105,0.1);
            z-index: 998;
            display: none;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -8px 24px -8px rgba(0,0,0,0.12);
        }
        .psb-sticky-cta .info-mini {
            flex: 1;
            font-size: 0.78rem;
            color: var(--gray-600);
            line-height: 1.4;
        }
        .psb-sticky-cta .info-mini strong {
            color: var(--gray-900);
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .psb-sticky-cta .btn-daftar-primary {
            padding: 12px 24px;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px -2px rgba(5,150,105,0.4);
        }

        /* ─────────────────────────────────────────────
           IMAGE ZOOM MODAL
           ───────────────────────────────────────────── */
        .img-zoom-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.92);
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.25s ease;
            touch-action: none;
        }
        .img-zoom-overlay.active { display: flex; opacity: 1; }
        .img-zoom-stage {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .img-zoom-stage img {
            max-width: 90vw; max-height: 90vh;
            transform-origin: center center;
            transition: transform 0.15s ease-out;
            user-select: none; -webkit-user-drag: none;
            will-change: transform;
            cursor: grab;
        }
        .img-zoom-stage img.dragging { cursor: grabbing; transition: none; }
        .img-zoom-toolbar {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            display: flex; gap: 8px;
        }
        .img-zoom-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.15); color: #fff;
            border: none; cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s;
            backdrop-filter: blur(8px);
        }
        .img-zoom-btn:hover { background: rgba(255,255,255,0.3); }
        .img-zoom-btn:active { transform: scale(0.92); }
        .img-zoom-hint {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 0.82rem;
            background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 20px;
            backdrop-filter: blur(8px); z-index: 10000;
            pointer-events: none;
        }

        /* ─────────────────────────────────────────────
           LOADING STATE
           ───────────────────────────────────────────── */
        .psb-loading {
            text-align: center;
            padding: 80px 24px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 16px -6px rgba(0,0,0,0.06);
        }

        /* ─────────────────────────────────────────────
           RESPONSIVE
           ───────────────────────────────────────────── */
        @media (max-width: 768px) {
            .psb-countdown-hero, .psb-final-cta { padding: 40px 24px; }
            .psb-poster-card, .psb-checklist-card { padding: 24px 20px; }
            .countdown-item { padding: 14px 16px; min-width: 70px; }
            .countdown-item .number { font-size: 1.7rem; }
            .psb-info-grid { grid-template-columns: 1fr; }
            .psb-checklist-list { grid-template-columns: 1fr; }
            .psb-sticky-cta { display: flex; }
            body { padding-bottom: 78px; }
        }
        @media (max-width: 576px) {
            .countdown-grid { gap: 8px; }
            .countdown-item { padding: 10px 12px; min-width: 60px; }
            .countdown-item .number { font-size: 1.4rem; }
            .countdown-item .label { font-size: 0.62rem; }
            .psb-countdown-hero .cta-row, .psb-final-cta .cta-row { flex-direction: column; align-items: stretch; }
            .btn-daftar-primary, .btn-daftar-secondary { justify-content: center; }
            .psb-checklist-progress { flex-direction: column; align-items: stretch; }
            .psb-checklist-progress .progress-pct { text-align: left; }
        }
    </style>
</head>

        <!-- PSB Action Content -->

    <!-- Sticky Mobile CTA -->
    <div class="psb-sticky-cta" id="psb-sticky-cta" style="display:none;">

            <span id="sticky-cta-status">Pendaftaran Dibuka</span>

            <i class="fa-solid fa-pen-to-square"></i> Daftar
        </a>
    </div>

    <!-- Image Zoom Modal -->
    <div class="img-zoom-overlay" id="imgZoomOverlay" aria-hidden="true" role="dialog" aria-label="Pratinjau gambar">
        <div class="img-zoom-toolbar">
            <button class="img-zoom-btn" id="zoomInBtn" title="Perbesar" aria-label="Perbesar"><i class="fa-solid fa-plus"></i></button>
            <button class="img-zoom-btn" id="zoomOutBtn" title="Perkecil" aria-label="Perkecil"><i class="fa-solid fa-minus"></i></button>
            <button class="img-zoom-btn" id="zoomResetBtn" title="Reset" aria-label="Reset"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="img-zoom-btn" id="zoomCloseBtn" title="Tutup (ESC)" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="img-zoom-stage" id="imgZoomStage">
            <img id="imgZoomImg" src="" alt="Pratinjau gambar">
        </div>
        <div class="img-zoom-hint" id="imgZoomHint">Scroll untuk zoom • Drag untuk geser • ESC untuk tutup</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 50 });

        (function () {
            'use strict';

            // ============================================================
            // KONFIGURASI
            // ============================================================

            // Link fallback formulir pendaftaran online (jika admin belum set di CMS).
            var DEFAULT_LINK_PENDAFTARAN = 'https://psb-ponpesalmunawwarah.vercel.app/';

            // Nomor WhatsApp panitia (default)
            var DEFAULT_WA_NUMBER = '6283178710191';
            var DEFAULT_WA_TEXT = 'Halo Panitia PSB SMA Plus Almunawwarah, saya ingin bertanya tentang pendaftaran siswa baru.';

            // Daftar berkas yang perlu disiapkan sebelum mendaftar (untuk checklist interaktif)
            var PRE_REG_CHECKLIST = [
                'Data diri lengkap (nama, NISN, NIK, tempat & tanggal lahir)',
                'Pas foto 3×4 berwarna (4 lembar, background merah)',
                'Fotokopi Akta Kelahiran (legalisir)',
                'Fotokopi Kartu Keluarga (KK)',
                'Fotokopi raport semester 1–5',
                'Sertifikat prestasi (akademik/non-akademik) — opsional',
                'Surat keterangan sehat dari dokter',
                'Nomor WhatsApp aktif untuk konfirmasi',
                'Email aktif untuk pengiriman formulir',
                'SKCK (untuk siswa usia ≥ 17 tahun, jika tersedia)'
            ];

            var container = document.getElementById('psb-container');
            var stickyCta = document.getElementById('psb-sticky-cta');
            var stickyStatus = document.getElementById('sticky-cta-status');
            var stickyTahun = document.getElementById('sticky-cta-tahun');
            var stickyBtn = document.getElementById('sticky-cta-btn');

            // ============================================================
            // UTIL: Konversi URL gambar Google Drive → direct thumbnail
            // ============================================================
            function normalizeImageUrl(url) {
                if (!url) return '';
                url = String(url).trim();
                var match = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (match) return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1200';
                var match2 = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
                if (match2) return 'https://drive.google.com/thumbnail?id=' + match2[1] + '&sz=w1200';
                var match3 = url.match(/drive\.google\.com\/uc\?id=([a-zA-Z0-9_-]+)/);
                if (match3) return 'https://drive.google.com/thumbnail?id=' + match3[1] + '&sz=w1200';
                return url;
            }

            function fmtDateFull(iso) {
                if (!iso) return '';
                try {
                    var d = new Date(iso);
                    if (isNaN(d.getTime())) return '';
                    var days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
                    var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
                    return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() +
                        ' — ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ' WIB';
                } catch (e) { return ''; }
            }

            // ============================================================
            // IMAGE ZOOM MODAL
            // ============================================================
            (function setupZoom() {
                var overlay = document.getElementById('imgZoomOverlay');
                var stage    = document.getElementById('imgZoomStage');
                var img      = document.getElementById('imgZoomImg');
                var btnIn    = document.getElementById('zoomInBtn');
                var btnOut   = document.getElementById('zoomOutBtn');
                var btnReset = document.getElementById('zoomResetBtn');
                var btnClose = document.getElementById('zoomCloseBtn');
                var hint     = document.getElementById('imgZoomHint');

                var scale = 1, minScale = 1, maxScale = 5;
                var tx = 0, ty = 0;
                var isDragging = false;
                var lastX = 0, lastY = 0;
                var hintTimer = null;

                function applyTransform() {
                    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
                }
                function reset() {
                    scale = 1; tx = 0; ty = 0;
                    applyTransform();
                    img.classList.remove('dragging');
                }
                function open(src, alt) {
                    if (!src) return;
                    img.src = src;
                    img.alt = alt || 'Pratinjau gambar';
                    reset();
                    overlay.classList.add('active');
                    overlay.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                    showHint();
                }
                function close() {
                    overlay.classList.remove('active');
                    overlay.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                    img.src = '';
                }
                function setScale(s) {
                    scale = Math.max(minScale, Math.min(maxScale, s));
                    if (scale <= 1) { tx = 0; ty = 0; }
                    applyTransform();
                }
                function showHint() {
                    hint.style.opacity = '1';
                    if (hintTimer) clearTimeout(hintTimer);
                    hintTimer = setTimeout(function () {
                        hint.style.opacity = '0';
                    }, 3500);
                }

                stage.addEventListener('wheel', function (e) {
                    e.preventDefault();
                    var delta = e.deltaY < 0 ? 0.2 : -0.2;
                    setScale(scale + delta);
                }, { passive: false });
                stage.addEventListener('pointerdown', function (e) {
                    if (e.target !== img && e.target !== stage) return;
                    if (scale <= 1) return;
                    isDragging = true;
                    lastX = e.clientX; lastY = e.clientY;
                    img.classList.add('dragging');
                    stage.setPointerCapture(e.pointerId);
                });
                stage.addEventListener('pointermove', function (e) {
                    if (!isDragging) return;
                    tx += (e.clientX - lastX);
                    ty += (e.clientY - lastY);
                    lastX = e.clientX; lastY = e.clientY;
                    applyTransform();
                });
                function endDrag(e) {
                    if (!isDragging) return;
                    isDragging = false;
                    img.classList.remove('dragging');
                    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
                }
                stage.addEventListener('pointerup', endDrag);
                stage.addEventListener('pointercancel', endDrag);
                stage.addEventListener('pointerleave', endDrag);
                stage.addEventListener('dblclick', function (e) {
                    if (e.target === stage) { close(); return; }
                    setScale(scale >= 2 ? 1 : 2);
                });
                btnIn.addEventListener('click', function () { setScale(scale + 0.3); });
                btnOut.addEventListener('click', function () { setScale(scale - 0.3); });
                btnReset.addEventListener('click', reset);
                btnClose.addEventListener('click', close);
                stage.addEventListener('click', function (e) {
                    if (e.target === stage) close();
                });
                document.addEventListener('keydown', function (e) {
                    if (!overlay.classList.contains('active')) return;
                    if (e.key === 'Escape') close();
                    else if (e.key === '+' || e.key === '=') setScale(scale + 0.3);
                    else if (e.key === '-' || e.key === '_') setScale(scale - 0.3);
                    else if (e.key === '0') reset();
                });

                window.ImageZoom = { open: open, close: close };
            })();

            // ============================================================
            // COUNTDOWN LOGIC
            // ============================================================
            var cdState = { loaded: false, startMs: null, endMs: null, linkPendaftaran: DEFAULT_LINK_PENDAFTARAN };
            var cdTimer = null;
            var cdEls = {
                status: null,
                months: null, days: null, hours: null, minutes: null, seconds: null,
                grid: null, notice: null, hero: null
            };

            function pad(n) { return String(n).padStart(2, '0'); }

            function diffBreakdown(fromMs, toMs) {
                if (toMs <= fromMs) return { months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
                var from = new Date(fromMs);
                var to = new Date(toMs);
                var months = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
                var anchor = new Date(from.getTime());
                if (months > 0) {
                    anchor.setMonth(anchor.getMonth() + months);
                    if (anchor > to) {
                        months -= 1;
                        anchor.setMonth(anchor.getMonth() - 1);
                    }
                } else { months = 0; anchor = new Date(from.getTime()); }
                var remainingMs = to.getTime() - anchor.getTime();
                if (remainingMs < 0) remainingMs = 0;
                var days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
                var hours = Math.floor((remainingMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);
                return { months: months, days: days, hours: hours, minutes: minutes, seconds: seconds };
            }

            function setStatusBadge(el, label, kind) {
                if (!el) return;
                el.className = 'psb-status-badge ' + (kind || '');
                var txt = kind === 'open' ? 'Pendaftaran Dibuka' : (kind === 'closed' ? 'Pendaftaran Ditutup' : 'Akan Dibuka');
                el.innerHTML = '<span class="dot"></span> ' + (label || txt);
            }

            function renderCountdown(targetMs) {
                if (!cdEls.days) return;
                var now = Date.now();
                var diff = targetMs - now;
                if (diff <= 0) {
                    cdEls.months.textContent = '00';
                    cdEls.days.textContent = '00';
                    cdEls.hours.textContent = '00';
                    cdEls.minutes.textContent = '00';
                    cdEls.seconds.textContent = '00';
                    return;
                }
                var b = diffBreakdown(now, targetMs);
                cdEls.months.textContent = pad(b.months);
                cdEls.days.textContent = pad(b.days);
                cdEls.hours.textContent = pad(b.hours);
                cdEls.minutes.textContent = pad(b.minutes);
                cdEls.seconds.textContent = pad(b.seconds);
            }

            function updateStatus() {
                if (!cdState.loaded || !cdEls.hero) return;
                var now = Date.now();
                var startMs = cdState.startMs;
                var endMs = cdState.endMs;

                if (!startMs && !endMs) {
                    setStatusBadge(cdEls.status, 'Periode Belum Diumumkan', '');
                    cdEls.grid.style.display = 'none';
                    if (cdEls.notice) {
                        cdEls.notice.style.display = 'inline-block';
                        cdEls.notice.innerHTML = '<i class="fa-solid fa-info-circle"></i> Periode pendaftaran belum diumumkan. Anda tetap bisa membuka formulir pendaftaran untuk persiapan.';
                    }
                    return;
                }
                if (startMs && now < startMs) {
                    setStatusBadge(cdEls.status, 'Akan Dibuka', '');
                    cdEls.grid.style.display = 'flex';
                    if (cdEls.notice) cdEls.notice.style.display = 'none';
                    renderCountdown(startMs);
                    return;
                }
                if (endMs && now < endMs) {
                    setStatusBadge(cdEls.status, 'Pendaftaran Dibuka', 'open');
                    cdEls.grid.style.display = 'flex';
                    if (cdEls.notice) cdEls.notice.style.display = 'none';
                    renderCountdown(endMs);
                    return;
                }
                // Closed
                setStatusBadge(cdEls.status, 'Pendaftaran Ditutup', 'closed');
                cdEls.grid.style.display = 'none';
                if (cdEls.notice) {
                    cdEls.notice.style.display = 'none';
                    var doneEl = document.getElementById('psb-cd-done');
                    if (doneEl) doneEl.style.display = 'inline-block';
                }
            }

            function startCountdownTicker() {
                if (cdTimer) clearInterval(cdTimer);
                cdTimer = setInterval(updateStatus, 1000);
            }

            // ============================================================
            // BROSUR DOWNLOAD LOGIC
            // ============================================================
            function extractDriveFileId(url) {
                if (!url) return '';
                url = String(url).trim();
                var m1 = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (m1) return m1[1];
                var m2 = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
                if (m2) return m2[1];
                var m3 = url.match(/drive\.google\.com\/uc\?id=([a-zA-Z0-9_-]+)/);
                if (m3) return m3[1];
                var m4 = url.match(/drive\.google\.com\/thumbnail\?id=([a-zA-Z0-9_-]+)/);
                if (m4) return m4[1];
                return '';
            }

            function detectFileExtension(url) {
                if (!url) return 'unknown';
                var lower = String(url).toLowerCase();
                if (/\.(pdf)(\?|$|&)/.test(lower)) return 'pdf';
                if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?|$|&)/.test(lower)) return 'image';
                if (/\.(doc|docx)(\?|$|&)/.test(lower)) return 'doc';
                if (/\.(xls|xlsx)(\?|$|&)/.test(lower)) return 'xls';
                if (/drive\.google\.com/.test(lower)) return 'pdf';
                return 'unknown';
            }

            function showToastInline(message, type) {
                var existing = document.getElementById('psb-toast-inline');
                if (existing) existing.remove();
                var toast = document.createElement('div');
                toast.id = 'psb-toast-inline';
                toast.style.cssText = [
                    'position:fixed',
                    'bottom:24px',
                    'right:24px',
                    'z-index:99999',
                    'padding:14px 22px',
                    'border-radius:12px',
                    'background:' + (type === 'error' ? '#dc2626' : type === 'success' ? '#059669' : '#3b82f6'),
                    'color:white',
                    'font-size:0.88rem',
                    'font-weight:600',
                    'box-shadow:0 12px 28px -8px rgba(0,0,0,0.25)',
                    'opacity:0',
                    'transform:translateY(10px)',
                    'transition:all 0.3s ease',
                    'display:flex',
                    'align-items:center',
                    'gap:8px',
                    'max-width:340px'
                ].join(';');
                toast.innerHTML = '<i class="fa-solid ' + (type === 'error' ? 'fa-circle-xmark' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info') + '"></i> ' + message;
                document.body.appendChild(toast);
                requestAnimationFrame(function () {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateY(0)';
                });
                setTimeout(function () {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    setTimeout(function () { toast.remove(); }, 300);
                }, 3500);
            }

            function triggerBrowserDownload(href, downloadAttr) {
                var a = document.createElement('a');
                a.href = href;
                if (downloadAttr) a.download = downloadAttr;
                a.target = '_blank';
                a.rel = 'noopener';
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(function () {
                    document.body.removeChild(a);
                }, 1000);
            }

            function triggerBlobDownload(blob, filename) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(function () {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 1500);
            }

            async function downloadBrosur(url, tahunAjaran, btnEl) {
                if (!url) {
                    showToastInline('URL brosur tidak tersedia', 'error');
                    return;
                }
                var fileId = extractDriveFileId(url);
                var ext = detectFileExtension(url);
                var fileName = 'Brosur-PSB-' + (tahunAjaran || 'SMA-Plus-Almunawwarah').replace(/[\/\\]/g, '-');

                if (btnEl) {
                    btnEl.classList.add('loading');
                    btnEl.disabled = true;
                }

                // KASUS 1: Gambar dari Google Drive → fetch blob + download
                if (fileId && ext === 'image') {
                    var thumbUrl = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w2000';
                    showToastInline('Mengunduh brosur...', 'info');
                    try {
                        var response = await fetch(thumbUrl, { mode: 'cors' });
                        if (!response.ok) throw new Error('HTTP ' + response.status);
                        var blob = await response.blob();
                        triggerBlobDownload(blob, fileName + '.jpg');
                        showToastInline('Brosur berhasil diunduh ✓', 'success');
                    } catch (err) {
                        console.warn('Fetch blob gagal, fallback ke direct download URL:', err);
                        var directUrl = 'https://drive.google.com/uc?export=download&id=' + fileId;
                        triggerBrowserDownload(directUrl, fileName + '.jpg');
                        showToastInline('Mengunduh brosur... (mode langsung)', 'info');
                    }
                    if (btnEl) {
                        btnEl.classList.remove('loading');
                        btnEl.disabled = false;
                    }
                    return;
                }

                // KASUS 2: PDF / dokumen dari Google Drive → direct download URL
                if (fileId) {
                    var ext3 = ext === 'pdf' ? 'pdf' : (ext === 'doc' ? 'doc' : (ext === 'xls' ? 'xls' : 'pdf'));
                    var dlUrl = 'https://drive.google.com/uc?export=download&id=' + fileId;
                    showToastInline('Mengunduh brosur... (file akan tersimpan otomatis)', 'info');
                    triggerBrowserDownload(dlUrl, fileName + '.' + ext3);
                    if (btnEl) {
                        setTimeout(function () {
                            btnEl.classList.remove('loading');
                            btnEl.disabled = false;
                        }, 1200);
                    }
                    return;
                }

                // KASUS 3: Bukan Google Drive
                showToastInline('Mengunduh brosur...', 'info');
                triggerBrowserDownload(url, fileName);
                if (btnEl) {
                    setTimeout(function () {
                        btnEl.classList.remove('loading');
                        btnEl.disabled = false;
                    }, 1200);
                }
            }

            // ============================================================
            // RENDER PAGE
            // ============================================================
            function renderPage(item) {
                var judul = item && item.judul ? item.judul : 'Penerimaan Peserta Didik Baru';
                var tahun = item && item.tahun_ajaran ? item.tahun_ajaran : '2025/2026';
                var gambarRaw = item && item.gambar_psb ? item.gambar_psb : '';
                var gambar = gambarRaw ? normalizeImageUrl(gambarRaw) : '';
                var brosurRaw = item && item.brosur_psb ? item.brosur_psb : '';
                var link = item && item.link_pendaftaran ? item.link_pendaftaran : DEFAULT_LINK_PENDAFTARAN;
                // Ensure link starts with http
                if (link && !/^(https?:)?\/\//i.test(link)) {
                    link = 'https://' + link;
                }
                if (!link || link === '#') link = DEFAULT_LINK_PENDAFTARAN;

                cdState.linkPendaftaran = link;
                cdState.startMs = (item && item.tanggal_mulai) ? new Date(item.tanggal_mulai).getTime() : null;
                cdState.endMs = (item && item.tanggal_selesai) ? new Date(item.tanggal_selesai).getTime() : null;
                cdState.loaded = true;

                var html = '';

                // ───── 1. COUNTDOWN HERO ─────
                html +=
                    '<div class="psb-countdown-hero" data-aos="fade-up">' +
                    '  <div class="psb-status-badge" id="psb-status-badge"><span class="dot"></span> Memuat status...</div>' +
                    '  <h1>' + escapeHtml(judul) + '</h1>' +
                    '  <div class="tahun"><i class="fa-solid fa-calendar"></i> Tahun Ajaran ' + escapeHtml(tahun) + '</div>' +
                    '  <div class="countdown-status" id="psb-cd-status">Memuat jadwal pendaftaran...</div>' +
                    '  <div class="countdown-grid" id="psb-cd-grid" style="display:none;">' +
                    '    <div class="countdown-item"><div class="number" id="cd-months">00</div><div class="label">Bulan</div></div>' +
                    '    <div class="countdown-item"><div class="number" id="cd-days">00</div><div class="label">Hari</div></div>' +
                    '    <div class="countdown-item"><div class="number" id="cd-hours">00</div><div class="label">Jam</div></div>' +
                    '    <div class="countdown-item"><div class="number" id="cd-minutes">00</div><div class="label">Menit</div></div>' +
                    '    <div class="countdown-item"><div class="number" id="cd-seconds">00</div><div class="label">Detik</div></div>' +
                    '  </div>' +
                    '  <div class="countdown-notice" id="psb-cd-notice" style="display:none;"></div>' +
                    '  <div class="countdown-done" id="psb-cd-done" style="display:none;"><i class="fa-solid fa-circle-check"></i> Pendaftaran Telah Ditutup</div>' +
                    '  <div class="cta-row" style="margin-top: 28px;">' +
                    '    <a href="' + escapeHtml(link) + '" target="_blank" rel="noopener" class="btn-daftar-primary" id="btn-daftar-hero"><i class="fa-solid fa-pen-to-square"></i> Daftar Sekarang</a>' +
                    '    <a href="info-psb.html" class="btn-daftar-secondary"><i class="fa-solid fa-circle-info"></i> Lihat Info Lengkap</a>' +
                    '  </div>' +
                    '</div>';

                // ───── 2. POSTER CARD ─────
                html +=
                    '<div class="psb-poster-card" data-aos="fade-up">' +
                    '  <div class="head">' +
                    '    <div class="icon-box"><i class="fa-solid fa-image"></i></div>' +
                    '    <div>' +
                    '      <h2>Poster Pendaftaran</h2>' +
                    '      <div class="sub">Pelajari poster sebelum mendaftar • klik untuk perbesar</div>' +
                    '    </div>' +
                    '  </div>' +
                    '  <div class="psb-poster-wrap" id="psb-poster-wrap">';
                if (gambar) {
                    html += '<img id="psb-poster-img" src="' + gambar + '" alt="Poster Pendaftaran ' + escapeHtml(tahun) + '" loading="lazy">';
                } else {
                    html +=
                        '<div class="psb-poster-empty">' +
                        '  <div class="ph-icon"><i class="fa-regular fa-image"></i></div>' +
                        '  <h4>Poster belum tersedia</h4>' +
                        '  <p>Poster pendaftaran belum diunggah. Anda tetap bisa mendaftar via tombol di bawah.</p>' +
                        '</div>';
                }
                html += '  </div>';
                if (gambar) {
                    html +=
                        '  <div class="psb-poster-actions">' +
                        '    <button class="psb-poster-btn" id="psb-poster-zoom"><i class="fa-solid fa-expand"></i> Perbesar Poster</button>' +
                        (brosurRaw ? '    <button class="psb-poster-btn primary" id="psb-poster-download-quick"><i class="fa-solid fa-download"></i> Unduh Brosur</button>' : '') +
                        '    <a href="' + gambar + '" target="_blank" rel="noopener" class="psb-poster-btn"><i class="fa-solid fa-up-right-from-square"></i> Buka di tab baru</a>' +
                        '  </div>';
                }
                html +=
                    '  <div style="margin-top: 22px; text-align: center;">' +
                    '    <a href="' + escapeHtml(link) + '" target="_blank" rel="noopener" class="btn-daftar-primary"><i class="fa-solid fa-pen-to-square"></i> Daftar Sekarang</a>' +
                    '  </div>' +
                    '</div>';

                // ───── 2b. BROSUR DOWNLOAD ─────
                if (brosurRaw) {
                    var brosurExt = detectFileExtension(brosurRaw);
                    var brosurIcon = brosurExt === 'pdf' ? 'fa-file-pdf' :
                                     (brosurExt === 'image' ? 'fa-file-image' : 'fa-file-arrow-down');
                    var brosurLabel = brosurExt === 'pdf' ? 'Brosur PDF' :
                                      (brosurExt === 'image' ? 'Brosur Gambar' : 'Brosur Pendaftaran');
                    var brosurSizeLabel = brosurExt === 'pdf' ? 'Dokumen PDF' :
                                          (brosurExt === 'image' ? 'Gambar resolusi tinggi' : 'File brosur');

                    html +=
                        '<div class="psb-poster-card" data-aos="fade-up" id="brosur-section">' +
                        '  <div class="head">' +
                        '    <div class="icon-box" style="background: linear-gradient(135deg, var(--accent), #d97706);"><i class="fa-solid fa-download"></i></div>' +
                        '    <div>' +
                        '      <h2>Brosur & Materi Pendaftaran</h2>' +
                        '      <div class="sub">Unduh brosur lengkap untuk dibaca offline</div>' +
                        '    </div>' +
                        '  </div>' +
                        '  <div class="psb-brosur-card">' +
                        '    <div class="psb-brosur-icon"><i class="fa-solid ' + brosurIcon + '"></i></div>' +
                        '    <div class="psb-brosur-info">' +
                        '      <h4>Brosur PSB ' + escapeHtml(tahun) + '</h4>' +
                        '      <p>Unduh brosur resmi pendaftaran siswa baru berisi informasi lengkap: program unggulan, biaya, persyaratan, dan alur pendaftaran.</p>' +
                        '      <div style="margin-top:6px;font-size:0.78rem;color:var(--gray-500);display:flex;gap:12px;flex-wrap:wrap;">' +
                        '        <span><i class="fa-solid fa-file" style="color:var(--accent);"></i> ' + escapeHtml(brosurLabel) + '</span>' +
                        '        <span><i class="fa-solid fa-bolt" style="color:var(--accent);"></i> Unduh langsung</span>' +
                        '      </div>' +
                        '    </div>' +
                        '    <button class="btn-download-brosur" id="btn-download-brosur">' +
                        '      <i class="fa-solid fa-download"></i> Unduh Brosur' +
                        '    </button>' +
                        '  </div>' +
                        '</div>';
                }

                // ───── 3. PRE-REGISTRATION CHECKLIST ─────
                html +=
                    '<div class="psb-checklist-card" data-aos="fade-up">' +
                    '  <div class="head">' +
                    '    <div class="icon-box"><i class="fa-solid fa-clipboard-check"></i></div>' +
                    '    <div>' +
                    '      <h2>Persiapan Sebelum Mendaftar</h2>' +
                    '      <div class="sub">Centang setiap berkas yang sudah Anda siapkan</div>' +
                    '    </div>' +
                    '  </div>' +
                    '  <div class="psb-checklist-list" id="psb-checklist-list">';
                for (var i = 0; i < PRE_REG_CHECKLIST.length; i++) {
                    html +=
                        '<div class="psb-checklist-item" data-idx="' + i + '">' +
                        '  <div class="checkbox"><i class="fa-solid fa-check"></i></div>' +
                        '  <span>' + escapeHtml(PRE_REG_CHECKLIST[i]) + '</span>' +
                        '</div>';
                }
                html += '  </div>' +
                    '  <div class="psb-checklist-progress">' +
                    '    <div class="progress-text">' +
                    '      <h4 id="progress-label">Belum ada berkas yang siap</h4>' +
                    '      <div class="sub">Klik setiap item untuk menandai sudah siap</div>' +
                    '    </div>' +
                    '    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>' +
                    '    <div class="progress-pct" id="progress-pct">0%</div>' +
                    '  </div>' +
                    '</div>';

                // ───── 4. QUICK INFO GRID (3 cards) ─────
                html +=
                    '<div class="psb-info-grid" data-aos="fade-up">' +
                    '  <a href="info-psb.html#syarat" class="psb-info-card">' +
                    '    <div class="icon"><i class="fa-solid fa-list-check"></i></div>' +
                    '    <h4>Persyaratan</h4>' +
                    '    <p>Lihat daftar lengkap persyaratan pendaftaran siswa baru</p>' +
                    '    <span class="link">Lihat Detail <i class="fa-solid fa-arrow-right"></i></span>' +
                    '  </a>' +
                    '  <a href="info-psb.html#biaya" class="psb-info-card">' +
                    '    <div class="icon"><i class="fa-solid fa-money-bill"></i></div>' +
                    '    <h4>Biaya Pendaftaran</h4>' +
                    '    <p>Informasi biaya pendidikan dan opsi pembayaran</p>' +
                    '    <span class="link">Lihat Detail <i class="fa-solid fa-arrow-right"></i></span>' +
                    '  </a>' +
                    '  <a href="https://wa.me/' + DEFAULT_WA_NUMBER + '?text=' + encodeURIComponent(DEFAULT_WA_TEXT) + '" target="_blank" rel="noopener" class="psb-info-card">' +
                    '    <div class="icon"><i class="fa-solid fa-headset"></i></div>' +
                    '    <h4>Hubungi Panitia</h4>' +
                    '    <p>Tanya jawab langsung dengan panitia PSB via WhatsApp</p>' +
                    '    <span class="link">Chat Sekarang <i class="fa-brands fa-whatsapp"></i></span>' +
                    '  </a>' +
                    '</div>';

                // ───── 5. FINAL CTA ─────
                html +=
                    '<div class="psb-final-cta" data-aos="fade-up">' +
                    '  <h2>Siap Bergabung dengan SMA Plus Almunawwarah?</h2>' +
                    '  <p>Klik tombol di bawah untuk membuka formulir pendaftaran online. Pastikan Anda sudah menyiapkan semua berkas yang dibutuhkan.</p>' +
                    '  <div class="cta-row">' +
                    '    <a href="' + escapeHtml(link) + '" target="_blank" rel="noopener" class="btn-daftar-primary"><i class="fa-solid fa-pen-to-square"></i> Buka Formulir Pendaftaran</a>' +
                    '    <a href="https://wa.me/' + DEFAULT_WA_NUMBER + '?text=' + encodeURIComponent(DEFAULT_WA_TEXT) + '" target="_blank" rel="noopener" class="btn-daftar-secondary"><i class="fa-brands fa-whatsapp"></i> Tanya Panitia</a>' +
                    '  </div>' +
                    '</div>';

                container.innerHTML = html;
                AOS.refresh();

                // Wire countdown elements
                cdEls.hero = document.querySelector('.psb-countdown-hero');
                cdEls.status = document.getElementById('psb-status-badge');
                cdEls.grid = document.getElementById('psb-cd-grid');
                cdEls.notice = document.getElementById('psb-cd-notice');
                cdEls.months = document.getElementById('cd-months');
                cdEls.days = document.getElementById('cd-days');
                cdEls.hours = document.getElementById('cd-hours');
                cdEls.minutes = document.getElementById('cd-minutes');
                cdEls.seconds = document.getElementById('cd-seconds');
                var cdStatusText = document.getElementById('psb-cd-status');

                if (cdState.startMs || cdState.endMs) {
                    cdEls.grid.style.display = 'flex';
                    if (cdStatusText) {
                        cdStatusText.textContent = cdState.startMs && Date.now() < cdState.startMs
                            ? 'Menuju Pembukaan Pendaftaran'
                            : 'Pendaftaran Sedang Dibuka — Akan Ditutup Dalam';
                    }
                    updateStatus();
                    startCountdownTicker();
                } else {
                    cdEls.grid.style.display = 'none';
                    if (cdStatusText) cdStatusText.textContent = 'Periode pendaftaran belum diumumkan';
                    setStatusBadge(cdEls.status, 'Periode Belum Diumumkan', '');
                    if (cdEls.notice) {
                        cdEls.notice.style.display = 'inline-block';
                        cdEls.notice.innerHTML = '<i class="fa-solid fa-info-circle"></i> Periode belum diumumkan — Anda tetap bisa membuka formulir untuk persiapan.';
                    }
                }

                // Wire poster zoom
                var posterImg = document.getElementById('psb-poster-img');
                var posterZoom = document.getElementById('psb-poster-zoom');
                if (posterImg) {
                    var openZoom = function () {
                        if (window.ImageZoom) window.ImageZoom.open(gambar, 'Poster Pendaftaran ' + tahun);
                    };
                    posterImg.addEventListener('click', openZoom);
                    if (posterZoom) posterZoom.addEventListener('click', openZoom);
                    posterImg.addEventListener('error', function () {
                        var wrap = document.getElementById('psb-poster-wrap');
                        if (wrap) {
                            wrap.innerHTML =
                                '<div class="psb-poster-empty">' +
                                '  <div class="ph-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>' +
                                '  <h4>Poster gagal dimuat</h4>' +
                                '  <p>Pastikan URL gambar benar dan izin sharing Google Drive diset "Anyone with the link".</p>' +
                                '</div>';
                        }
                    });
                }

                // Wire checklist interactivity
                wireChecklist();

                // Wire brosur download
                var brosurBtn = document.getElementById('btn-download-brosur');
                if (brosurBtn) {
                    brosurBtn.addEventListener('click', function () {
                        downloadBrosur(brosurRaw, tahun, brosurBtn);
                    });
                }
                var quickBrosurBtn = document.getElementById('psb-poster-download-quick');
                if (quickBrosurBtn) {
                    quickBrosurBtn.addEventListener('click', function () {
                        var brosurSection = document.getElementById('brosur-section');
                        if (brosurSection) {
                            brosurSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                        downloadBrosur(brosurRaw, tahun, quickBrosurBtn);
                    });
                }

                // Wire sticky CTA
                if (stickyCta) {
                    stickyStatus.textContent = 'Pendaftaran Tersedia';
                    stickyTahun.textContent = tahun;
                    stickyBtn.setAttribute('href', link);
                    var showSticky = function () {
                        var hero = document.querySelector('.psb-countdown-hero');
                        if (!hero) return;
                        var rect = hero.getBoundingClientRect();
                        if (rect.bottom < 100) {
                            stickyCta.style.display = 'flex';
                        } else {
                            stickyCta.style.display = 'none';
                        }
                    };
                    window.addEventListener('scroll', showSticky, { passive: true });
                    showSticky();
                }
            }

            // ============================================================
            // CHECKLIST INTERACTIVITY
            // ============================================================
            function wireChecklist() {
                var items = document.querySelectorAll('.psb-checklist-item');
                var progressFill = document.getElementById('progress-fill');
                var progressPct = document.getElementById('progress-pct');
                var progressLabel = document.getElementById('progress-label');
                if (!items.length) return;

                // Restore from localStorage if available
                var saved = {};
                try {
                    var s = localStorage.getItem('psb_checklist_v1');
                    if (s) saved = JSON.parse(s);
                } catch (e) {}

                function update() {
                    var checked = 0;
                    items.forEach(function (item) {
                        if (item.classList.contains('checked')) checked++;
                    });
                    var pct = Math.round((checked / items.length) * 100);
                    if (progressFill) progressFill.style.width = pct + '%';
                    if (progressPct) progressPct.textContent = pct + '%';
                    if (progressLabel) {
                        if (checked === 0) progressLabel.textContent = 'Belum ada berkas yang siap';
                        else if (checked === items.length) progressLabel.textContent = 'Semua berkas siap! Anda siap mendaftar 🎉';
                        else progressLabel.textContent = checked + ' dari ' + items.length + ' berkas siap';
                    }
                    // Save state
                    var state = {};
                    items.forEach(function (item, i) {
                        state[i] = item.classList.contains('checked');
                    });
                    try { localStorage.setItem('psb_checklist_v1', JSON.stringify(state)); } catch (e) {}
                }

                items.forEach(function (item, i) {
                    if (saved[i]) item.classList.add('checked');
                    item.addEventListener('click', function () {
                        item.classList.toggle('checked');
                        update();
                    });
                });
                update();
            }

            // ============================================================
            // LOAD DATA
            // ============================================================
            async function loadData() {
                try {
                    var data = await SMAPlusAPI.fetchInfoPSB();
                    console.info('[Link PSB] Data diterima dari DB:', data);
                    if (data && data.length > 0) {
                        console.info('[Link PSB] Menampilkan row:', data[0]);
                        renderPage(data[0]);
                    } else {
                        console.warn('[Link PSB] Tidak ada row di tabel info_psb. Pakai default.');
                        renderPage({});
                    }
                } catch (err) {
                    console.error('[Link PSB] Gagal memuat data PSB:', err);
                    renderPage({});
                }
            }

            loadData();

            // ============================================================
            // LIVE UPDATE: Re-render otomatis kalau ada perubahan data
            // ============================================================
            window.addEventListener('smaplus:data-updated', function (e) {
                var detail = e.detail || {};
                if (detail.table === 'info_psb') {
                    console.info('[Link PSB] Data berubah di DB, re-render otomatis');
                    var freshData = detail.data;
                    if (Array.isArray(freshData) && freshData.length > 0) {
                        renderPage(freshData[0]);
                    } else if (freshData && !Array.isArray(freshData)) {
                        renderPage(freshData);
                    }
                }
            });
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
            window.addEventListener('load', function() {
                var swPath = (window.location.pathname.includes('/pages/') || window.location.pathname.includes('/admincms/')) ? '../sw.js' : 'sw.js';
                navigator.serviceWorker.register(swPath).then(function(reg) {
                    console.log('SW registered:', reg.scope);
                }).catch(function(err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
