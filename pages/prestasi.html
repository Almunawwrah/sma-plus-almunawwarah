<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestasi - SMA Plus Almunawwarah</title>
    <meta name="description" content="Prestasi dan penghargaan SMA Plus Almunawwarah di berbagai kompetisi akademik dan non-akademik tingkat sekolah hingga nasional.">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .filter-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .filter-pill {
            padding: 8px 20px;
            border-radius: 50px;
            border: 2px solid var(--gray-200);
            background: white;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            color: var(--gray-600);
        }

        .filter-pill:hover,
        .filter-pill.active {
            border-color: var(--primary);
            background: var(--primary-lighter);
            color: var(--primary);
        }

        .prestasi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .prestasi-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            text-align: center;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .prestasi-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
        }

        .prestasi-card-photo-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--primary-lighter);
            overflow: hidden;
            cursor: zoom-in;
        }

        .prestasi-card-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .prestasi-card-photo-wrap:hover .prestasi-card-photo {
            transform: scale(1.06);
        }

        .prestasi-card-photo-wrap::after {
            content: "\f00e";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            color: var(--primary, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .prestasi-card-photo-wrap:hover::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .prestasi-card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .prestasi-card-body h3 {
            font-size: 1rem;
            margin-bottom: 4px;
            color: var(--gray-800);
            line-height: 1.4;
        }

        .prestasi-card-body .tingkat {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .prestasi-card-body .meta {
            font-size: 0.8rem;
            color: var(--gray-500);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .prestasi-card-body .meta i {
            font-size: 0.7rem;
        }

        .prestasi-card-body .meta .separator {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--gray-300);
            display: inline-block;
        }

        .tingkat-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tingkat-badge-Nasional {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .tingkat-badge-Provinsi {
            background: #ede9fe;
            color: #6d28d9;
        }

        .tingkat-badge-Kabupaten {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .tingkat-badge-Sekolah {
            background: #fef3c7;
            color: #92400e;
        }

        .tingkat-badge-Internasional {
            background: #fce7f3;
            color: #9d174d;
        }

        .tingkat-badge-Kecamatan {
            background: #dcfce7;
            color: #166534;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
        }

        .empty-state p {
            font-size: 1rem;
            color: var(--gray-500);
        }

        /* ===== Lightbox / Photo Zoom ===== */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 24px;
            box-sizing: border-box;
        }

        .lightbox-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-container {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform: scale(0.85);
            transition: transform 0.3s ease;
        }

        .lightbox-overlay.active .lightbox-container {
            transform: scale(1);
        }

        .lightbox-image {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: block;
            cursor: zoom-out;
        }

        .lightbox-caption {
            color: #fff;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            max-width: 700px;
            line-height: 1.5;
            padding: 0 12px;
        }

        .lightbox-caption .tingkat-badge {
            margin-top: 6px;
        }

        /* Tombol Exit (X) */
        .lightbox-close {
            position: absolute;
            top: -16px;
            right: -16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #fff;
            color: #1f2937;
            border: none;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
            transition: all 0.2s ease;
            z-index: 2;
        }

        .lightbox-close:hover {
            background: #ef4444;
            color: #fff;
            transform: rotate(90deg) scale(1.05);
        }

        /* Tombol exit floating (pojok kanan atas layar) */
        .lightbox-exit-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            z-index: 10000;
        }

        .lightbox-exit-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
            transform: scale(1.08);
        }

        /* Tombol navigasi (opsional) */
        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            z-index: 10000;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lightbox-prev { left: 24px; }
        .lightbox-next { right: 24px; }

        .lightbox-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            z-index: 10000;
        }

        @media (max-width: 576px) {
            .lightbox-close {
                top: -10px;
                right: -10px;
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
            .lightbox-exit-btn {
                top: 16px;
                right: 16px;
                width: 42px;
                height: 42px;
            }
            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .lightbox-prev { left: 12px; }
            .lightbox-next { right: 12px; }
        }

        @media (max-width: 992px) {
            .prestasi-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .prestasi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .prestasi-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="page-header">
            <div class="container">
                <h1 data-aos="fade-up">Prestasi</h1>
                <p data-aos="fade-up" data-aos-delay="100">Deretan pencapaian membanggakan SMA Plus Almunawwarah</p>
                <div class="breadcrumb" data-aos="fade-up" data-aos-delay="200">
                    <a href="../index.html">Beranda</a>
                    <span>/</span>
                    <a href="#">Profil</a>
                    <span>/</span>
                    <span>Prestasi</span>
                </div>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div class="text-center" style="margin-bottom: 40px;">
                    <span class="section-badge" data-aos="fade-up">Prestasi</span>
                    <h2 class="section-title" data-aos="fade-up" data-aos-delay="100">Pencapaian Sekolah</h2>
                    <p class="section-subtitle" data-aos="fade-up" data-aos-delay="200">Prestasi akademik dan non-akademik yang diraih oleh siswa-siswi kami</p>
                </div>

                <div class="filter-pills" id="filter-pills" data-aos="fade-up" data-aos-delay="100">
                    <button class="filter-pill active" data-filter="Semua">Semua</button>
                    <button class="filter-pill" data-filter="Sekolah">Sekolah</button>
                    <button class="filter-pill" data-filter="Kecamatan">Kecamatan</button>
                    <button class="filter-pill" data-filter="Kabupaten">Kabupaten</button>
                    <button class="filter-pill" data-filter="Provinsi">Provinsi</button>
                    <button class="filter-pill" data-filter="Nasional">Nasional</button>
                    <button class="filter-pill" data-filter="Internasional">Internasional</button>
                </div>

                <div class="prestasi-grid" id="prestasi-grid">
                    <div class="loading-spinner" style="grid-column: 1 / -1;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- ===== Lightbox Overlay ===== -->
    <div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto prestasi">
        <button class="lightbox-exit-btn" id="lightbox-exit" aria-label="Tutup pratinjau" title="Tutup (Esc)">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Foto sebelumnya" title="Sebelumnya">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Foto berikutnya" title="Berikutnya">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <div class="lightbox-container">
            <button class="lightbox-close" id="lightbox-close" aria-label="Tutup" title="Tutup">&times;</button>
            <img class="lightbox-image" id="lightbox-image" src="" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>

        <div class="lightbox-hint">Tekan <strong>Esc</strong> atau klik di luar gambar untuk menutup &middot; <strong>&larr; &rarr;</strong> untuk navigasi</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        (function () {
            'use strict';

            var grid = document.getElementById('prestasi-grid');
            var filterContainer = document.getElementById('filter-pills');
            var allData = [];
            var activeFilter = 'Semua';

            // ===== Lightbox elements =====
            var lightbox = document.getElementById('lightbox');
            var lightboxImage = document.getElementById('lightbox-image');
            var lightboxCaption = document.getElementById('lightbox-caption');
            var lightboxExit = document.getElementById('lightbox-exit');
            var lightboxClose = document.getElementById('lightbox-close');
            var lightboxPrev = document.getElementById('lightbox-prev');
            var lightboxNext = document.getElementById('lightbox-next');

            var currentGallery = []; // list of { src, judul, tingkat, badgeClass }
            var currentIndex = 0;

            function getTingkatBadgeClass(tingkat) {
                var map = {
                    'Nasional': 'tingkat-badge-Nasional',
                    'Provinsi': 'tingkat-badge-Provinsi',
                    'Kabupaten': 'tingkat-badge-Kabupaten',
                    'Sekolah': 'tingkat-badge-Sekolah',
                    'Kecamatan': 'tingkat-badge-Kecamatan',
                    'Internasional': 'tingkat-badge-Internasional'
                };
                return map[tingkat] || 'tingkat-badge-Sekolah';
            }

            function buildMeta(item) {
                var parts = [];
                if (item.peserta) {
                    parts.push('<span><i class="fa-solid fa-user"></i> ' + escapeHtml(item.peserta) + '</span>');
                }
                if (item.tahun) {
                    parts.push('<span><i class="fa-solid fa-calendar"></i> ' + escapeHtml(String(item.tahun)) + '</span>');
                }
                if (parts.length === 0) return '';
                return '<div class="meta">' + parts.join('<span class="separator"></span>') + '</div>';
            }

            function buildCaption(item) {
                var tingkat = item.tingkat || 'Sekolah';
                var badgeClass = getTingkatBadgeClass(tingkat);
                var html = '<div>' + escapeHtml(item.judul || 'Prestasi') + '</div>';
                html += '<span class="tingkat-badge ' + badgeClass + '">' + escapeHtml(tingkat) + '</span>';
                if (item.peserta || item.tahun) {
                    var meta = [];
                    if (item.peserta) meta.push(escapeHtml(item.peserta));
                    if (item.tahun) meta.push(escapeHtml(String(item.tahun)));
                    html += '<div style="margin-top:6px;font-size:0.85rem;opacity:0.85;">' + meta.join(' &middot; ') + '</div>';
                }
                return html;
            }

            function renderPrestasi(data) {
                if (!data || data.length === 0) {
                    grid.innerHTML =
                        '<div class="empty-state">' +
                        '  <i class="fa-solid fa-trophy"></i>' +
                        '  <p>Tidak ada prestasi yang ditampilkan untuk kategori ini.</p>' +
                        '</div>';
                    currentGallery = [];
                    return;
                }

                var html = '';
                currentGallery = [];

                data.forEach(function (item, index) {
                    var delay = (index % 4) * 100;
                    var tingkat = item.tingkat || 'Sekolah';
                    var badgeClass = getTingkatBadgeClass(tingkat);
                    var fotoUrl = getImageUrl(item.foto_link);
                    var fallback = 'https://via.placeholder.com/400x300/059669/ffffff?text=Prestasi';

                    // Simpan untuk navigasi lightbox
                    currentGallery.push({
                        src: fotoUrl,
                        fallback: fallback,
                        judul: item.judul,
                        tingkat: tingkat,
                        badgeClass: badgeClass,
                        peserta: item.peserta,
                        tahun: item.tahun
                    });

                    html +=
                        '<div class="prestasi-card" data-tingkat="' + escapeHtml(tingkat) + '" data-aos="fade-up" data-aos-delay="' + delay + '">' +
                        '  <div class="prestasi-card-photo-wrap" data-index="' + index + '" role="button" tabindex="0" aria-label="Perbesar foto: ' + escapeHtml(item.judul || 'Prestasi') + '">' +
                        '    <img src="' + fotoUrl + '" alt="' + escapeHtml(item.judul) + '" class="prestasi-card-photo" onerror="this.src=\'' + fallback + '\'" loading="lazy">' +
                        '  </div>' +
                        '  <div class="prestasi-card-body">' +
                        '    <h3>' + escapeHtml(item.judul) + '</h3>' +
                        '    <div class="tingkat"><span class="tingkat-badge ' + badgeClass + '">' + escapeHtml(tingkat) + '</span></div>' +
                        buildMeta(item) +
                        '  </div>' +
                        '</div>';
                });

                grid.innerHTML = html;

                // Pasang event listener untuk klik foto
                var photoWraps = grid.querySelectorAll('.prestasi-card-photo-wrap');
                photoWraps.forEach(function (wrap) {
                    wrap.addEventListener('click', function () {
                        var idx = parseInt(wrap.getAttribute('data-index'), 10);
                        openLightbox(idx);
                    });
                    wrap.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            var idx = parseInt(wrap.getAttribute('data-index'), 10);
                            openLightbox(idx);
                        }
                    });
                });

                AOS.refresh();
            }

            // ===== Lightbox Logic =====
            function openLightbox(index) {
                if (currentGallery.length === 0) return;
                currentIndex = index;
                updateLightboxImage();
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
                // Fokus ke tombol exit untuk aksesibilitas
                setTimeout(function () { lightboxExit.focus(); }, 100);
            }

            function updateLightboxImage() {
                var item = currentGallery[currentIndex];
                if (!item) return;
                lightboxImage.src = item.src;
                lightboxImage.alt = item.judul || 'Prestasi';
                lightboxImage.onerror = function () {
                    this.onerror = null;
                    this.src = item.fallback;
                };
                lightboxCaption.innerHTML = buildCaption(item);

                // Sembunyikan tombol navigasi jika hanya 1 foto
                var showNav = currentGallery.length > 1;
                lightboxPrev.style.display = showNav ? 'flex' : 'none';
                lightboxNext.style.display = showNav ? 'flex' : 'none';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                lightboxImage.src = '';
            }

            function showPrev() {
                if (currentGallery.length <= 1) return;
                currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
                updateLightboxImage();
            }

            function showNext() {
                if (currentGallery.length <= 1) return;
                currentIndex = (currentIndex + 1) % currentGallery.length;
                updateLightboxImage();
            }

            // Event listeners untuk lightbox
            lightboxExit.addEventListener('click', closeLightbox);
            lightboxClose.addEventListener('click', closeLightbox);
            lightboxPrev.addEventListener('click', function (e) { e.stopPropagation(); showPrev(); });
            lightboxNext.addEventListener('click', function (e) { e.stopPropagation(); showNext(); });

            // Klik backdrop (di luar gambar) untuk menutup
            lightbox.addEventListener('click', function (e) {
                if (e.target === lightbox || e.target.classList.contains('lightbox-container')) {
                    closeLightbox();
                }
            });

            // Klik gambar juga menutup (zoom-out)
            lightboxImage.addEventListener('click', closeLightbox);

            // Keyboard navigation
            document.addEventListener('keydown', function (e) {
                if (!lightbox.classList.contains('active')) return;
                switch (e.key) {
                    case 'Escape':
                        closeLightbox();
                        break;
                    case 'ArrowLeft':
                        showPrev();
                        break;
                    case 'ArrowRight':
                        showNext();
                        break;
                }
            });

            function filterData(tingkat) {
                if (tingkat === 'Semua') {
                    return allData;
                }
                return allData.filter(function (item) {
                    return item.tingkat && item.tingkat.toLowerCase() === tingkat.toLowerCase();
                });
            }

            function setActivePill(tingkat) {
                var pills = filterContainer.querySelectorAll('.filter-pill');
                pills.forEach(function (pill) {
                    pill.classList.remove('active');
                    if (pill.getAttribute('data-filter') === tingkat) {
                        pill.classList.add('active');
                    }
                });
            }

            filterContainer.addEventListener('click', function (e) {
                var pill = e.target.closest('.filter-pill');
                if (!pill) return;

                var filter = pill.getAttribute('data-filter');
                activeFilter = filter;
                setActivePill(filter);

                var filtered = filterData(filter);
                renderPrestasi(filtered);
            });

            async function loadPrestasi() {
                try {
                    var data = await SMAPlusAPI.fetchPrestasi();
                    allData = data || [];

                    if (allData.length === 0) {
                        grid.innerHTML =
                            '<div class="empty-state">' +
                            '  <i class="fa-solid fa-trophy"></i>' +
                            '  <p>Data prestasi belum tersedia.</p>' +
                            '</div>';
                        return;
                    }

                    renderPrestasi(allData);
                } catch (err) {
                    console.error('Gagal memuat prestasi:', err);
                    grid.innerHTML =
                        '<div class="empty-state" style="grid-column: 1 / -1;">' +
                        '  <i class="fa-solid fa-circle-exclamation"></i>' +
                        '  <p>Gagal memuat data prestasi. Silakan coba lagi nanti.</p>' +
                        '</div>';
                }
            }

            loadPrestasi();

            AOS.init({
                duration: 800,
                easing: 'ease-out-cubic',
                once: true,
                offset: 80
            });
        })();
    </script>
    <script>
        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                var swPath = (window.location.pathname.includes('/pages/') || window.location.pathname.includes('/admincms/')) ? '../sw.js' : 'sw.js';
                navigator.serviceWorker.register(swPath).then(function(reg) {
                    console.log('SW registered:', reg.scope);
                }).catch(function(err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
