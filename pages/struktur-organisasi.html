<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur Organisasi - SMA Plus Almunawwarah</title>
    <meta name="description" content="Struktur organisasi SMA Plus Almunawwarah, susunan kepengurusan dan jabatan dalam lembaga pendidikan Islam.">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .struktur-image-container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
        }
        .struktur-image-container img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-lg);
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.3s;
        }
        .struktur-image-container img:hover {
            transform: scale(1.01);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--gray-400);
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            color: var(--gray-300);
        }
        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--gray-500);
            margin-bottom: 8px;
        }
        .empty-state p {
            font-size: 0.95rem;
            color: var(--gray-400);
            max-width: 400px;
            margin: 0 auto;
        }
        .zoom-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            cursor: zoom-out;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .zoom-overlay.active {
            display: flex;
        }
        .zoom-overlay img {
            max-width: 95%;
            max-height: 95vh;
            object-fit: contain;
            border-radius: 8px;
        }
        .zoom-hint {
            text-align: center;
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--gray-400);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .zoom-hint i {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="page-header">
            <div class="container">
                <h1 data-aos="fade-up">Struktur Organisasi</h1>
                <p data-aos="fade-up" data-aos-delay="100">Susunan kepengurusan SMA Plus Almunawwarah</p>
                <div class="breadcrumb" data-aos="fade-up" data-aos-delay="200">
                    <a href="../index.html">Beranda</a>
                    <span>/</span>
                    <a href="#">Profil</a>
                    <span>/</span>
                    <span>Struktur Organisasi</span>
                </div>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div class="text-center" style="margin-bottom: 40px;">
                    <span class="section-badge" data-aos="fade-up">Organisasi</span>
                    <h2 class="section-title" data-aos="fade-up" data-aos-delay="100">Struktur Organisasi Sekolah</h2>
                    <p class="section-subtitle" data-aos="fade-up" data-aos-delay="200">Bagan struktur organisasi lengkap SMA Plus Almunawwarah</p>
                </div>

                <div id="struktur-container" data-aos="fade-up" data-aos-delay="300">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Zoom Overlay -->
    <div class="zoom-overlay" id="zoom-overlay">
        <img id="zoom-image" src="" alt="Struktur Organisasi - Zoom">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        (function () {
            'use strict';

            var container = document.getElementById('struktur-container');
            var zoomOverlay = document.getElementById('zoom-overlay');
            var zoomImage = document.getElementById('zoom-image');

            function attachZoom(displayUrl) {
                var img = document.getElementById('struktur-img');
                if (img) {
                    img.addEventListener('click', function() {
                        zoomImage.src = displayUrl;
                        zoomOverlay.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    });
                }
            }

            function renderImage(imageUrl) {
                var displayUrl = getImageUrl(imageUrl);
                container.innerHTML =
                    '<div class="struktur-image-container" data-aos="fade-up">' +
                    '  <img src="' + escapeHtml(displayUrl) + '" alt="Struktur Organisasi SMA Plus Almunawwarah" id="struktur-img" style="cursor:zoom-in" loading="lazy">' +
                    '  <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> Klik gambar untuk memperbesar</div>' +
                    '</div>';
                attachZoom(displayUrl);
                AOS.refresh();
            }

            async function loadStrukturImage() {
                try {
                    var imageUrl = await SMAPlusAPI.fetchGambarStrukturOrganisasi();

                    if (!imageUrl || imageUrl.trim() === '') {
                        container.innerHTML =
                            '<div class="empty-state" data-aos="fade-up">' +
                            '  <i class="fa-solid fa-image"></i>' +
                            '  <h3>Gambar Struktur Organisasi Belum Tersedia</h3>' +
                            '  <p>Belum ada gambar struktur organisasi. Silakan upload melalui CMS.</p>' +
                            '</div>';
                        AOS.refresh();
                        return;
                    }

                    renderImage(imageUrl);
                    cachePageData('struktur_organisasi', { imageUrl: imageUrl });

                } catch (err) {
                    console.error('Gagal memuat gambar struktur organisasi:', err);
                    container.innerHTML =
                        '<div class="empty-state">' +
                        '  <i class="fa-solid fa-circle-exclamation"></i>' +
                        '  <h3>Gagal Memuat Data</h3>' +
                        '  <p>Terjadi kesalahan saat memuat gambar struktur organisasi. Silakan coba lagi nanti.</p>' +
                        '</div>';
                }
            }

            // Close zoom overlay
            zoomOverlay.addEventListener('click', function() {
                zoomOverlay.classList.remove('active');
                document.body.style.overflow = '';
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && zoomOverlay.classList.contains('active')) {
                    zoomOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });

            // Initialize AOS
            AOS.init({
                duration: 800,
                easing: 'ease-out-cubic',
                once: true,
                offset: 80
            });

            // Load data - try cache first, then refresh in background
            var cached = getCachedPageData('struktur_organisasi');
            if (cached && cached.imageUrl) {
                renderImage(cached.imageUrl);
                loadStrukturImage(); // refresh cache in background
            } else {
                loadStrukturImage();
            }
        })();
    </script>
    <script>
        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                var swPath = (window.location.pathname.includes('/pages/') || window.location.pathname.includes('/admincms/')) ? '../sw.js' : 'sw.js';
                navigator.serviceWorker.register(swPath).then(function(reg) {
                    console.log('SW registered:', reg.scope);
                }).catch(function(err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
