<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita - SMA Plus Almunawwarah</title>
    <meta name="description" content="Berita dan informasi terbaru dari SMA Plus Almunawwarah.">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .berita-toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:30px}
        .search-box{flex:1;min-width:250px;position:relative}
        .search-box input{width:100%;padding:12px 16px 12px 44px;border:2px solid var(--gray-200);border-radius:50px;font-size:0.9rem;font-family:inherit;transition:all 0.3s;outline:none}
        .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
        .search-box i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gray-400)}
        .berita-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
        .berita-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.07);transition:all 0.3s;cursor:pointer}
        .berita-card:hover{transform:translateY(-6px);box-shadow:0 20px 25px rgba(0,0,0,0.1)}
        .berita-card-image{height:200px;background-size:cover;background-position:center;position:relative}
        .berita-card-date{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 12px;border-radius:8px;font-size:0.75rem}
        .berita-card-body{padding:20px}
        .berita-card-body h3{font-size:1.05rem;margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .berita-card-body p{font-size:0.85rem;color:var(--gray-500);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
        .berita-card-footer{display:flex;justify-content:space-between;align-items:center}
        .berita-read-more{color:var(--primary);font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:4px}
        .pagination{display:flex;gap:8px;justify-content:center;margin-top:40px;align-items:center}
        .pagination button{min-width:40px;height:40px;border-radius:10px;border:2px solid var(--gray-200);background:#fff;font-size:0.85rem;cursor:pointer;transition:all 0.3s;font-family:inherit;display:flex;align-items:center;justify-content:center}
        .pagination button.active{border-color:var(--primary);background:var(--primary);color:#fff}
        .pagination button:hover:not(.active):not(:disabled){border-color:var(--primary);color:var(--primary)}
        .pagination button:disabled{opacity:0.5;cursor:not-allowed}
        .pagination-info{font-size:0.85rem;color:var(--gray-500);margin-top:12px;text-align:center}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:slideUp 0.3s ease}
        .modal-image{height:280px;background-size:cover;background-position:center;position:relative}
        .modal-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
        .modal-close:hover{background:rgba(0,0,0,0.7)}
        .modal-body{padding:28px}
        .modal-meta{display:flex;gap:16px;margin-bottom:16px;font-size:0.85rem;color:var(--gray-500)}
        .modal-meta span{display:flex;align-items:center;gap:6px}
        .modal-body h2{font-size:1.5rem;margin-bottom:16px}
        .modal-body .konten{font-size:0.95rem;line-height:1.8;color:var(--gray-700)}

        .empty-state{text-align:center;padding:60px 20px}
        .empty-state i{font-size:3rem;color:var(--gray-300);margin-bottom:16px;display:block}
        .empty-state h3{color:var(--gray-500);margin-bottom:8px}
        .empty-state p{color:var(--gray-400);font-size:0.9rem}

        @keyframes slideUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
        @media(max-width:992px){.berita-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:576px){.berita-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="page-header">
            <div class="container">
                <h1 data-aos="fade-up">Berita</h1>
                <p data-aos="fade-up" data-aos-delay="100">Informasi dan kabar terbaru dari SMA Plus Almunawwarah</p>
                <div class="breadcrumb" data-aos="fade-up" data-aos-delay="200">
                    <a href="../index.html">Beranda</a>
                    <span>/</span>
                    <a href="#">Informasi</a>
                    <span>/</span>
                    <span>Berita</span>
                </div>
            </div>
        </div>

        <section class="section">
            <div class="container">
                <div class="berita-toolbar" data-aos="fade-up">
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="search-input" placeholder="Cari berita...">
                    </div>
                </div>

                <div class="berita-grid" id="berita-grid">
                    <div class="loading-spinner" style="grid-column:1/-1;">
                        <div class="spinner"></div>
                    </div>
                </div>

                <div class="pagination" id="pagination"></div>
                <div class="pagination-info" id="pagination-info"></div>
            </div>
        </section>

        <div class="modal-overlay" id="berita-modal">
            <div class="modal">
                <div class="modal-image" id="modal-image"></div>
                <button class="modal-close" id="modal-close">&times;</button>
                <div class="modal-body">
                    <div class="modal-meta">
                        <span id="modal-date"><i class="fa-solid fa-calendar"></i></span>
                        <span id="modal-author"><i class="fa-solid fa-user"></i></span>
                    </div>
                    <h2 id="modal-title"></h2>
                    <div class="konten" id="modal-konten"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        (function () {
            'use strict';

            var grid = document.getElementById('berita-grid');
            var searchInput = document.getElementById('search-input');
            var paginationContainer = document.getElementById('pagination');
            var paginationInfo = document.getElementById('pagination-info');
            var modalOverlay = document.getElementById('berita-modal');
            var modalImage = document.getElementById('modal-image');
            var modalClose = document.getElementById('modal-close');
            var modalDate = document.getElementById('modal-date');
            var modalAuthor = document.getElementById('modal-author');
            var modalTitle = document.getElementById('modal-title');
            var modalKonten = document.getElementById('modal-konten');

            var allBerita = [];
            var filteredBerita = [];
            var currentPage = 1;
            var perPage = 6;

            function renderBerita() {
                var totalPages = Math.ceil(filteredBerita.length / perPage);
                if (currentPage > totalPages && totalPages > 0) {
                    currentPage = totalPages;
                }
                var start = (currentPage - 1) * perPage;
                var end = start + perPage;
                var pageData = filteredBerita.slice(start, end);

                if (filteredBerita.length === 0) {
                    var isSearching = searchInput.value.trim().length > 0;
                    grid.innerHTML =
                        '<div class="empty-state" style="grid-column:1/-1;">' +
                        '  <i class="fa-solid ' + (isSearching ? 'fa-search' : 'fa-newspaper') + '"></i>' +
                        '  <h3>' + (isSearching ? 'Tidak Ada Hasil' : 'Belum Ada Berita') + '</h3>' +
                        '  <p>' + (isSearching ? 'Tidak ditemukan berita yang sesuai dengan kata kunci Anda.' : 'Data berita belum tersedia saat ini.') + '</p>' +
                        '</div>';
                    paginationContainer.innerHTML = '';
                    paginationInfo.textContent = '';
                    return;
                }

                var html = '';
                for (var i = 0; i < pageData.length; i++) {
                    var item = pageData[i];
                    var imgUrl = getImageUrl(item.foto_link);
                    var dateStr = formatDateShort(item.created_at);
                    var title = escapeHtml(item.judul || '');
                    var excerpt = escapeHtml(truncateText(item.ringkasan || item.konten || '', 120));
                    var author = escapeHtml(item.penulis || 'Admin');
                    var delay = (i % 3) * 100;

                    html +=
                        '<div class="berita-card" data-index="' + (start + i) + '" data-aos="fade-up" data-aos-delay="' + delay + '">' +
                        '  <div class="berita-card-image" style="background-image:url(\'' + escapeHtml(imgUrl) + '\');">' +
                        '    <div class="berita-card-date">' + escapeHtml(dateStr) + '</div>' +
                        '  </div>' +
                        '  <div class="berita-card-body">' +
                        '    <h3>' + title + '</h3>' +
                        '    <p>' + excerpt + '</p>' +
                        '    <div class="berita-card-footer">' +
                        '      <span style="font-size:0.8rem;color:var(--gray-400);"><i class="fa-solid fa-user" style="margin-right:4px;"></i>' + author + '</span>' +
                        '      <span class="berita-read-more">Baca <i class="fa-solid fa-arrow-right"></i></span>' +
                        '    </div>' +
                        '  </div>' +
                        '</div>';
                }

                grid.innerHTML = html;
                renderPagination(totalPages);

                var showingEnd = Math.min(end, filteredBerita.length);
                paginationInfo.textContent = 'Menampilkan ' + (start + 1) + '–' + showingEnd + ' dari ' + filteredBerita.length + ' berita';

                AOS.refresh();
            }

            function renderPagination(totalPages) {
                if (totalPages <= 1) {
                    paginationContainer.innerHTML = '';
                    return;
                }

                var html = '';

                html += '<button data-page="prev" ' + (currentPage === 1 ? 'disabled' : '') + '><i class="fa-solid fa-chevron-left"></i></button>';

                var maxVisible = 5;
                var startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                var endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage + 1 < maxVisible) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }

                if (startPage > 1) {
                    html += '<button data-page="1">1</button>';
                    if (startPage > 2) {
                        html += '<button disabled>...</button>';
                    }
                }

                for (var p = startPage; p <= endPage; p++) {
                    html += '<button data-page="' + p + '" class="' + (p === currentPage ? 'active' : '') + '">' + p + '</button>';
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        html += '<button disabled>...</button>';
                    }
                    html += '<button data-page="' + totalPages + '">' + totalPages + '</button>';
                }

                html += '<button data-page="next" ' + (currentPage === totalPages ? 'disabled' : '') + '><i class="fa-solid fa-chevron-right"></i></button>';

                paginationContainer.innerHTML = html;
            }

            paginationContainer.addEventListener('click', function (e) {
                var btn = e.target.closest('button');
                if (!btn || btn.disabled) return;

                var page = btn.getAttribute('data-page');
                var totalPages = Math.ceil(filteredBerita.length / perPage);

                if (page === 'prev') {
                    currentPage = Math.max(1, currentPage - 1);
                } else if (page === 'next') {
                    currentPage = Math.min(totalPages, currentPage + 1);
                } else {
                    currentPage = parseInt(page);
                }

                renderBerita();
                window.scrollTo({ top: grid.offsetTop - 100, behavior: 'smooth' });
            });

            searchInput.addEventListener('input', debounce(function () {
                var query = searchInput.value.trim().toLowerCase();
                if (query.length === 0) {
                    filteredBerita = allBerita.slice();
                } else {
                    filteredBerita = allBerita.filter(function (item) {
                        return (item.judul || '').toLowerCase().includes(query);
                    });
                }
                currentPage = 1;
                renderBerita();
            }, 300));

            grid.addEventListener('click', function (e) {
                var card = e.target.closest('.berita-card');
                if (!card) return;

                var index = parseInt(card.getAttribute('data-index'));
                var item = filteredBerita[index];
                if (!item) return;

                openModal(item);
            });

            function openModal(item) {
                var imgUrl = getImageUrl(item.foto_link);
                modalImage.style.backgroundImage = "url('" + escapeHtml(imgUrl) + "')";
                modalDate.innerHTML = '<i class="fa-solid fa-calendar"></i> ' + escapeHtml(formatDate(item.created_at));
                modalAuthor.innerHTML = '<i class="fa-solid fa-user"></i> ' + escapeHtml(item.penulis || 'Admin');
                modalTitle.textContent = item.judul || '';
                modalKonten.innerHTML = item.konten || '';

                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);

            modalOverlay.addEventListener('click', function (e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });

            async function loadBerita() {
                try {
                    var data = await SMAPlusAPI.fetchBerita();
                    allBerita = data || [];
                    filteredBerita = allBerita.slice();

                    if (allBerita.length === 0) {
                        grid.innerHTML =
                            '<div class="empty-state" style="grid-column:1/-1;">' +
                            '  <i class="fa-solid fa-newspaper"></i>' +
                            '  <h3>Belum Ada Berita</h3>' +
                            '  <p>Data berita belum tersedia saat ini.</p>' +
                            '</div>';
                        return;
                    }

                    renderBerita();
                } catch (err) {
                    console.error('Gagal memuat berita:', err);
                    grid.innerHTML =
                        '<div class="empty-state" style="grid-column:1/-1;">' +
                        '  <i class="fa-solid fa-circle-exclamation"></i>' +
                        '  <h3>Gagal Memuat Data</h3>' +
                        '  <p>Tidak dapat memuat data berita. Silakan coba lagi nanti.</p>' +
                        '</div>';
                }
            }

            loadBerita();

            AOS.init({
                duration: 800,
                easing: 'ease-out-cubic',
                once: true,
                offset: 80
            });
        })();
    </script>
    <script>
        // Register Service Worker for caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                var swPath = (window.location.pathname.includes('/pages/') || window.location.pathname.includes('/admincms/')) ? '../sw.js' : 'sw.js';
                navigator.serviceWorker.register(swPath).then(function(reg) {
                    console.log('SW registered:', reg.scope);
                }).catch(function(err) {
                    console.warn('SW registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
